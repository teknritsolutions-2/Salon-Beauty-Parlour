<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />

    <meta
      name="description"
      content="Explore hair, skin and makeup services, indicative prices and appointment planning at Fleur &amp; Form Salon &amp; Beauty Parlour."

    <link rel="icon" href="../assets/icons/bloom.svg" />

  <body data-page="gallery">
    <a class="skip" href="#main">Skip to content</a>
    <header></header>
    <main id="main">
      <section class="intro wrap">
        <p class="eyebrow"><i> </i>The inspiration edit</p>
        <h1>Gallery</h1>

        <div id="filters" class="filters" aria-label="Filter by category"></div>

          <button class="outline btn" id="prev">Previous</button>
          <span id="caption" aria-live="polite"> </span>
          <button class="outline btn" id="next">Next</button>
